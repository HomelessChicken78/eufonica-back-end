spring:
  application:
    name: engagement-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: ${KAFKA_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      properties:
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:engagement-service-group}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: ${KAFKA_LISTENER_ACK_MODE:RECORD}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/api}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    it.eufonica.engagementservice.service: ${SERVICE_LOG_LEVEL:INFO}
    if.eufonica.engagementservice.controller: ${CONTROLLER_LOG_LEVEL:INFO}
    it.eufonica.engagementservice.consumer: ${CONSUMER_LOG_LEVEL:INFO}
    it.eufonica.event.processing: ${EVENT_PROCESSING_LOG_LEVEL:INFO}