spring:
  application:
    name: catalog-command-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

server:
  servlet:
    context-path: ${CONTEXT_PATH:/api}

    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    it.musicplatform.catalogcommandservice.service.impl: ${SERVICE_LOG_LEVEL:INFO}