spring:
  application:
    name: catalog-command-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: ${KAFKA_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:catalog-command-service-group}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: ${KAFKA_LISTENER_ACK_MODE:RECORD}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/api}

    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    it.eufonica.catalogcommandservice.service: ${SERVICE_LOG_LEVEL:INFO}
    it.eufonica.catalogcommandservice.controller: ${CONTROLLER_LOG_LEVEL:INFO}
    it.eufonica.catalogcommandservice.security: ${SECURITY_LOG_LEVEL:INFO}
    it.eufonica.catalogcommandservice.outbox: ${OUTBOX_LOG_LEVEL:INFO}